server:
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:120}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:5000}

spring:
  application:
    name: quiz-platform
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    hikari:
      pool-name: QuizHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

quiz:
  seed:
    enabled: ${QUIZ_SEED_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  scoring:
    grace-period-ms: ${SCORING_GRACE_PERIOD_MS:300}
  ratelimit:
    login: ${RATE_LIMIT_LOGIN:500}
    register: ${RATE_LIMIT_REGISTER:300}
    audit: ${RATE_LIMIT_AUDIT:500}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.example.quiz: INFO
    org.springframework.security: INFO
